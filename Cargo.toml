[package]
name = "linkguard"
version = "0.2.0"
edition = "2021"
default-run = "linkguard"

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = "2.1"
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
toml = "0.8"
tree-sitter = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"

[features]
dev-keygen = []

[[bin]]
name = "linkguard"
path = "src/main.rs"

[[bin]]
name = "linkguard-keygen"
path = "src/bin/keygen.rs"
required-features = ["dev-keygen"]