name: LinkGuard Physics Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  security-events: write

jobs:
  linkguard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
      - name: Run LinkGuard unit tests
        run: cargo test
      - name: Check optional Pro GUI feature build
        run: cargo check --features gui
      - name: Run LinkGuard SARIF demo (bad_telemetry.py fixture)
        continue-on-error: true
        run: cargo run --release -- check --config budgets.toml --format sarif > linkguard.sarif
      - name: Upload SARIF to GitHub Code Scanning
        if: always() && hashFiles('linkguard.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: linkguard.sarif
          category: linkguard