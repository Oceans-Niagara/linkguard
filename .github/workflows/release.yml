name: Release Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: linkguard-windows-x86_64.exe
            bin_path: target/release/linkguard.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: linkguard-linux-x86_64
            bin_path: target/release/linkguard
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: linkguard-macos-aarch64
            bin_path: target/release/linkguard

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release binary with GUI
        run: cargo build --release --features gui

      - name: Stage release asset
        shell: bash
        run: cp "${{ matrix.bin_path }}" "${{ matrix.asset_name }}"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}